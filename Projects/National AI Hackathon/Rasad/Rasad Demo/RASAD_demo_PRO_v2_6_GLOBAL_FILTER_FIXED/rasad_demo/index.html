<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b3155" />
  <title>RASAD — iqtisodiy xavflarni intellektual tahlil qilish platformasi</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-13a7 7 0 1 0-14 0c0 6.8 7 13 7 13Z"/><circle cx="12" cy="9" r="2.4" fill="white"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V7l8-4 8 4v14H4Zm4-9h2V9H8v3Zm6 0h2V9h-2v3ZM8 17h2v-3H8v3Zm6 0h2v-3h-2v3Z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10h4v10H4Zm6 0V4h4v16h-4Zm6 0v-7h4v7h-4Z"/></symbol>
    <symbol id="i-network" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.3"/><circle cx="12" cy="5" r="2.3"/><circle cx="19" cy="12" r="2.3"/><circle cx="12" cy="19" r="2.3"/><path d="M6.8 10.5 10.4 6.8M13.6 6.8l3.6 3.7M17.2 13.5l-3.6 3.7M10.4 17.2l-3.6-3.7" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M12 22a2.6 2.6 0 0 0 2.5-2h-5A2.6 2.6 0 0 0 12 22Zm7-6-2-2.5V9a5 5 0 0 0-4-4.9V3a1 1 0 0 0-2 0v1.1A5 5 0 0 0 7 9v4.5L5 16v2h14v-2Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6V2Zm8 1.8V7h3.2L14 3.8ZM9 11h6v1.7H9V11Zm0 4h6v1.7H9V15Z"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v5c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 10v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5M5 15v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-model" viewBox="0 0 24 24"><path d="M12 2 4 7v10l8 5 8-5V7l-8-5Zm0 2.1L17.5 7 12 10 6.5 7 12 4.1ZM6 8.8l5 2.8v7.7l-5-3V8.8Zm12 0v7.5l-5 3v-7.7l5-2.8Z"/></symbol>
    <symbol id="i-audit" viewBox="0 0 24 24"><path d="M5 3h10v3h4v15H5V3Zm2 2v14h10V8h-4V5H7Zm2 6h6v1.6H9V11Zm0 3.7h6v1.6H9v-1.6Z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-5 3.2-7 8-7s7.3 2 8 7H4Z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="m20.4 13.2-1.6-.9c.1-.4.1-.9 0-1.3l1.6-.9-1.7-3-1.6.9a7 7 0 0 0-1.2-.7V5.4h-3.4v1.9a7 7 0 0 0-1.2.7L9.7 7 8 10l1.6.9a6 6 0 0 0 0 1.3L8 13.1l1.7 3 1.6-.9c.4.3.8.5 1.2.7v1.9h3.4v-1.9c.4-.2.8-.4 1.2-.7l1.6.9 1.7-2.9ZM14.2 14a2.8 2.8 0 1 1 0-5.6 2.8 2.8 0 0 1 0 5.6Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 1 0 4.2 11.5L20 20.8 21.5 19l-5.2-5.1A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M6 2h2v3h8V2h2v3h3v17H3V5h3V2Zm13 8H5v10h14V10Z"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><rect x="11" y="10" width="2" height="7" rx="1" fill="white"/><circle cx="12" cy="7" r="1.2" fill="white"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M11 3h2v10l3.5-3.5 1.4 1.4-5.9 5.9-5.9-5.9 1.4-1.4L11 13V3ZM5 19h14v2H5v-2Z"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M11 17h2V7l3.5 3.5 1.4-1.4L12 3.2 6.1 9.1l1.4 1.4L11 7v10ZM5 19h14v2H5v-2Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m9.4 17.2-5-5 1.4-1.4 3.6 3.6 8.8-8.8 1.4 1.4-10.2 10.2Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div class="brand-name">RASAD</div>
      </div>
      <p class="brand-desc">Iqtisodiy xavf tahlili<br>va qarorlarni qo‘llab-quvvatlash<br>platformasi</p>

      <nav class="side-nav" id="sideNav"></nav>

      <div class="sidebar-city" aria-hidden="true">
        <svg viewBox="0 0 220 92" preserveAspectRatio="none">
          <path d="M0 81h220M10 81V59h15v22m8 0V45h13v36m7 0V63h22v18m8 0V35h13v46m7 0V52h14v29m8 0V19h7v62m6 0V48h21v33m7 0V61h12v20m7 0V39h9v42m8 0V55h16v26" fill="none" stroke="rgba(58,154,240,.38)" stroke-width="1.2"/>
          <path d="M121 19h7l-2-9-1-6-1 6-3 9Zm43 20h9v-16l-4-8-5 8v16Z" fill="none" stroke="rgba(58,154,240,.38)" stroke-width="1.2"/>
        </svg>
      </div>
      <div class="sidebar-tagline">Ma’lumot asosida<br>barqaror rivojlanish sari</div>
      <div class="sidebar-version">RASAD demo v2.6</div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Menyuni ochish">☰</button>
        <div class="search-box">
          <svg><use href="#i-search"/></svg>
          <input id="globalSearch" type="search" autocomplete="off" placeholder="Subyekt, hudud, tarmoq yoki ichki kod bo‘yicha qidirish..." />
          <kbd>Ctrl + K</kbd>
          <div class="search-results" id="searchResults"></div>
        </div>
        <button class="period-box top-chip" id="periodBtn">
          <svg><use href="#i-calendar"/></svg>
          <div><small>Hisobot davri</small><strong id="periodLabel">2024-yil, yanvar – dekabr</strong></div>
          <span class="chevron">⌄</span>
        </button>
        <div class="freshness top-chip plain"><span class="live-dot"></span><div><small>Ma’lumotlar yangilanishi</small><strong>2024-12-28 10:24</strong><em>(UTC+5)</em></div></div>
        <button class="icon-button notify-btn" id="notifyBtn" aria-label="Ogohlantirishlar"><svg><use href="#i-bell"/></svg><span id="notificationCount">12</span></button>
        <button class="profile-box" id="profileBtn"><div class="avatar">AD</div><div><strong>Akmal Dadaboyev</strong><small id="roleLabel">Tizim ma’muri</small></div><span class="chevron">⌄</span></button>
      </header>

      <section class="content" id="appContent" aria-live="polite"></section>
    </main>
  </div>

  <div class="popover" id="notificationPopover"></div>
  <div class="popover profile-popover" id="profilePopover"></div>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="why-drawer" id="whyDrawer" aria-hidden="true"></aside>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
